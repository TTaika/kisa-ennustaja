<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kisa Ennustaja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script>
    try {
      if (localStorage.getItem("theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">

        <svg class="home-icon" viewBox="0 0 24 24" width="1.05em" height="1.05em" aria-hidden="true" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 3 22 12v9H2v-9Z M9 21v-7h6v7"/>
        </svg>
      </button>
      <button id="theme-toggle" class="secondary hamburger-btn" type="button" aria-label="Vaihda tumma teema">

      </button>
      <button id="nav-toggle" class="secondary hamburger-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="nav-dropdown" aria-label="Avaa valikko">
        <span class="hamburger-icon" aria-hidden="true">☰</span>
      </button>
      <nav class="tabs nav-dropdown" id="nav-dropdown">
        <a href="#/tehtava" data-tab="tehtava">Tehtävät</a>
        <a href="#/rasti" data-tab="rasti">Rastit</a>

        <a href="#/sarja" data-tab="sarja">Sarjat</a>
        <a href="#/ennuste" data-tab="ennuste">Ennuste</a>
        <a href="#/asetukset" data-tab="asetukset">Asetukset</a>
      </nav>
    </div>
  </header>
  <main id="view" class="view"></main>
  <script type="module" src="js/router-app.js"></script>
